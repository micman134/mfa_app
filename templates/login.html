<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MFA System - Secure Login</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container { width: 100%; max-width: 450px; }
        .card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .brand { text-align: center; margin-bottom: 30px; }
        .brand-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
        }
        .brand-icon i { font-size: 35px; color: white; }
        h2 { color: #333; font-size: 24px; margin-bottom: 5px; }
        .subtitle { color: #666; font-size: 13px; }
        .role-tabs {
            display: flex;
            gap: 10px;
            margin: 25px 0 20px;
            background: #f0f0f0;
            padding: 5px;
            border-radius: 50px;
        }
        .role-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            color: #666;
        }
        .role-tab.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }
        .input-wrapper { position: relative; }
        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #667eea;
        }
        .input-wrapper input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s;
        }
        .input-wrapper input:focus {
            border-color: #667eea;
            outline: none;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .risk-indicator {
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 4px solid #667eea;
            display: none;
        }
        .risk-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .risk-score { font-weight: bold; font-size: 20px; color: #667eea; }
        .risk-bar-container {
            background: #e0e0e0;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }
        .risk-bar {
            height: 100%;
            width: 0%;
            transition: width 0.5s;
        }
        .risk-bar.low { background: #28a745; }
        .risk-bar.medium { background: #ffc107; }
        .risk-bar.high { background: #dc3545; }
        .risk-factors {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            font-size: 12px;
            color: #666;
        }
        .otp-section { display: none; }
        .otp-inputs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }
        .otp-digit {
            width: 50px;
            height: 60px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
        }
        .otp-digit:focus {
            border-color: #667eea;
            outline: none;
        }
        .timer { text-align: center; margin: 15px 0; color: #666; }
        .alert {
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
        }
        .alert-success { background: #d4edda; color: #155724; }
        .alert-error { background: #f8d7da; color: #721c24; }
        .alert-warning { background: #fff3cd; color: #856404; }
        .security-features {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }
        .feature { text-align: center; flex: 1; }
        .feature i { font-size: 18px; color: #667eea; margin-bottom: 5px; }
        .feature span { font-size: 10px; color: #666; }
        .back-link {
            text-align: center;
            margin-top: 15px;
        }
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 13px;
        }
        @media (max-width: 480px) {
            .card { padding: 30px 20px; }
            .otp-digit { width: 45px; height: 55px; font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="brand">
                <div class="brand-icon"><i class="fas fa-shield-alt"></i></div>
                <h2>MFA System</h2>
                <p class="subtitle">AI-Powered Risk Assessment</p>
            </div>
            
            <div class="role-tabs">
                <div class="role-tab active" data-role="student">Student</div>
                <div class="role-tab" data-role="admin">Admin</div>
            </div>
            
            <div id="loginForm">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email / Username</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" placeholder="Enter your email or username" value="john@student.com">
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter your password">
                    </div>
                </div>
                <div id="riskIndicator" class="risk-indicator">
                    <div class="risk-header">
                        <span><i class="fas fa-shield-alt"></i> Risk Assessment</span>
                        <span class="risk-score" id="riskScore">0%</span>
                    </div>
                    <div class="risk-bar-container">
                        <div id="riskBar" class="risk-bar"></div>
                    </div>
                    <div class="risk-factors" id="riskFactors"></div>
                </div>
                <button class="login-btn" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </div>
            
            <div id="otpSection" style="display: none;">
                <h3 style="text-align:center; margin-bottom:15px;"><i class="fas fa-shield-alt"></i> Two-Factor Verification</h3>
                <p style="text-align:center; color:#666;">Enter the 6-digit code sent to your email</p>
                <div class="otp-inputs">
                    <input type="text" class="otp-digit" maxlength="1" pattern="[0-9]" inputmode="numeric">
                    <input type="text" class="otp-digit" maxlength="1" pattern="[0-9]" inputmode="numeric">
                    <input type="text" class="otp-digit" maxlength="1" pattern="[0-9]" inputmode="numeric">
                    <input type="text" class="otp-digit" maxlength="1" pattern="[0-9]" inputmode="numeric">
                    <input type="text" class="otp-digit" maxlength="1" pattern="[0-9]" inputmode="numeric">
                    <input type="text" class="otp-digit" maxlength="1" pattern="[0-9]" inputmode="numeric">
                </div>
                <div class="timer" id="timer"><i class="far fa-clock"></i> <span>05:00</span></div>
                <button class="login-btn" id="verifyBtn"><i class="fas fa-check-circle"></i> Verify</button>
                <div class="back-link">
                    <a href="#" id="resendLink"><i class="fas fa-redo-alt"></i> Resend Code</a>
                    <span style="margin:0 10px">|</span>
                    <a href="#" id="backLink"><i class="fas fa-arrow-left"></i> Back to Login</a>
                </div>
            </div>
            
            <div id="message" class="alert"></div>
            
            <div class="security-features">
                <div class="feature"><i class="fas fa-shield-alt"></i><span>2FA Protected</span></div>
                <div class="feature"><i class="fas fa-robot"></i><span>AI Risk Analysis</span></div>
                <div class="feature"><i class="fas fa-chart-line"></i><span>Real-time Monitoring</span></div>
            </div>
        </div>
    </div>
    
    <script>
        let currentRole = 'student';
        
        // Role switching
        document.querySelectorAll('.role-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentRole = this.dataset.role;
            });
        });
        
        function showMessage(text, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = text;
            msgDiv.className = `alert alert-${type}`;
            msgDiv.style.display = 'block';
            setTimeout(() => {
                msgDiv.style.display = 'none';
            }, 5000);
        }
        
        function showRisk(score, factors) {
            const indicator = document.getElementById('riskIndicator');
            const bar = document.getElementById('riskBar');
            const scoreSpan = document.getElementById('riskScore');
            const factorsDiv = document.getElementById('riskFactors');
            
            indicator.style.display = 'block';
            bar.style.width = score + '%';
            scoreSpan.textContent = Math.round(score) + '%';
            
            bar.className = 'risk-bar';
            if (score < 30) bar.classList.add('low');
            else if (score < 70) bar.classList.add('medium');
            else bar.classList.add('high');
            
            if (factors) {
                factorsDiv.innerHTML = '';
                for (const [key, value] of Object.entries(factors)) {
                    const icon = value ? 'check-circle' : 'exclamation-circle';
                    factorsDiv.innerHTML += `<div><i class="fas fa-${icon}"></i> ${key}</div>`;
                }
            }
        }
        
        let timerInterval;
        
        function startTimer(seconds) {
            const timerSpan = document.querySelector('#timer span');
            let timeLeft = seconds;
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                timerSpan.textContent = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    showMessage('Code expired. Please request a new code.', 'error');
                }
                timeLeft--;
            }, 1000);
        }
        
        // Login form submission
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            
            if (!username || !password) {
                showMessage('Please enter both email and password', 'error');
                return;
            }
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        role: currentRole
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    if (data.requires_otp) {
                        document.getElementById('loginForm').style.display = 'none';
                        document.getElementById('otpSection').style.display = 'block';
                        if (data.risk_score) {
                            showRisk(data.risk_score, {
                                Device: data.device_known,
                                Location: data.location_known,
                                Time: data.time_normal,
                                Velocity: data.velocity_normal
                            });
                        }
                        startTimer(data.otp_expiry || 300);
                        document.querySelector('.otp-digit').focus();
                    } else {
                        showMessage('Login successful! Redirecting...', 'success');
                        setTimeout(() => {
                            window.location.href = data.redirect;
                        }, 1500);
                    }
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                showMessage('Connection error. Please try again.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
            }
        });
        
        // OTP verification
        document.getElementById('verifyBtn').addEventListener('click', async () => {
            let otp = '';
            document.querySelectorAll('.otp-digit').forEach(input => otp += input.value);
            
            if (otp.length !== 6) {
                showMessage('Please enter the complete 6-digit code', 'error');
                return;
            }
            
            const btn = document.getElementById('verifyBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
            
            try {
                const response = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ otp: otp })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage('Verification successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = data.redirect;
                    }, 1000);
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                showMessage('Verification failed. Please try again.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check-circle"></i> Verify';
            }
        });
        
        // Resend OTP
        document.getElementById('resendLink').addEventListener('click', async (e) => {
            e.preventDefault();
            
            const link = document.getElementById('resendLink');
            link.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            
            try {
                const response = await fetch('/api/resend-otp', { method: 'POST' });
                const data = await response.json();
                
                if (data.success) {
                    showMessage('New verification code sent to your email', 'success');
                    startTimer(data.otp_expiry || 300);
                    document.querySelectorAll('.otp-digit').forEach(input => input.value = '');
                    document.querySelector('.otp-digit').focus();
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                showMessage('Failed to resend code. Please try again.', 'error');
            } finally {
                link.innerHTML = '<i class="fas fa-redo-alt"></i> Resend Code';
            }
        });
        
        // Back to login
        document.getElementById('backLink').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('otpSection').style.display = 'none';
            document.getElementById('riskIndicator').style.display = 'none';
            if (timerInterval) clearInterval(timerInterval);
        });
        
        // OTP input handling
        const otpInputs = document.querySelectorAll('.otp-digit');
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', function() {
                if (this.value.length === 1 && index < 5) {
                    otpInputs[index + 1].focus();
                }
            });
            
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && this.value.length === 0 && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
            
            input.addEventListener('keypress', function(e) {
                if (!/[0-9]/.test(e.key)) {
                    e.preventDefault();
                }
            });
        });
        
        // Focus on first input on page load
        document.getElementById('username').focus();
    </script>
</body>
</html>
